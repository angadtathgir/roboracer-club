# fly.toml app configuration file generated for roboracer-playground on 2026-09-04T21:47:33-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'roboracer-playground'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  GATEWAY_PORT = '8000'
  LIDAR_HZ = '10'
  LIDAR_STRIDE = '4'
  TELEMETRY_HZ = '20'

[[services]]
  protocol = 'tcp'
  internal_port = 4567
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 4567

[[services]]
  protocol = 'tcp'
  internal_port = 8000
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
